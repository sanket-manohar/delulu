<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Delulu — is your app store-ready or are you just delulu?</title>
  <meta name="description" content="Free, open-source pre-submission checks for APK, AAB and IPA. The same checks Google Play Console and App Store Connect run, OWASP MASVS security, privacy drafts and step-by-step release guides. Runs 100% in your browser.">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:title" content="Delulu 🫠 — it's only delulu until it's approved">
  <meta property="og:description" content="Drop an APK, AAB or IPA. Get the checks Play Console & App Store Connect run, security issues, fixes and every step to go live. 100% in-browser.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="assets/img/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <a class="skip" href="#page">Skip to content</a>

  <header class="gtop">
    <button class="icon-btn" type="button" data-action="collapse" data-icon="sidebar" aria-label="Toggle sidebar" title="Toggle sidebar"></button>
    <a class="brand" href="#/" aria-label="Delulu home">
      <img src="assets/img/logo.svg" alt="" width="24" height="24">
      <span class="brand-name">Delulu</span>
      <span class="ws-ver" id="version"></span>
    </a>
    <button class="gsearch" id="global-search" type="button" data-action="search" data-icon="search"><span>Search pages, checks, issues…</span><kbd>Ctrl K</kbd></button>
    <button class="btn primary new-btn" id="btn-new" type="button" data-action="new" data-icon="plus"><span class="hide-sm">New analysis</span></button>
    <div class="gtop-right">
      <button class="btn dl-btn" id="btn-download" type="button" data-action="download-report" data-icon="download" hidden><span class="hide-sm">Download report</span></button>
      <div class="menu" id="btn-export">
        <button class="icon-btn" type="button" data-action="menu" data-icon="share" aria-haspopup="true" aria-label="Share and export" title="Share & export"></button>
        <div class="menu-pop" role="menu">
          <div class="menu-label">Save</div>
          <button type="button" role="menuitem" data-action="download-report">💾 Report file (.json) — reopen later</button>
          <button type="button" role="menuitem" data-action="export-zip">🗂️ Docs pack (.zip of Markdown)</button>
          <button type="button" role="menuitem" data-action="export-md">📝 Single Markdown file</button>
          <button type="button" role="menuitem" data-action="print">🖨️ PDF (print all pages)</button>
          <div class="menu-label">Share</div>
          <button type="button" role="menuitem" data-action="copy-summary">📣 Copy shareable summary</button>
          <button type="button" role="menuitem" data-action="copy-badge">🏷️ Copy README badge</button>
        </div>
      </div>
      <div class="menu" id="btn-help">
        <button class="icon-btn" type="button" data-action="menu" data-icon="help" aria-haspopup="true" aria-label="Help" title="Help"></button>
        <div class="menu-pop" role="menu">
          <button type="button" role="menuitem" data-action="tour">🧭 Take the tour <kbd>?</kbd></button>
          <button type="button" role="menuitem" data-action="search">🔍 Search <kbd>Ctrl K</kbd></button>
          <button type="button" role="menuitem" data-action="download-report">💾 Download report <kbd>Ctrl S</kbd></button>
          <a role="menuitem" data-repo href="#" target="_blank" rel="noopener noreferrer">⭐ GitHub &amp; docs</a>
        </div>
      </div>
      <button class="icon-btn" id="btn-theme" type="button" aria-label="Toggle dark mode"></button>
    </div>
  </header>

  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Navigation">
      <nav id="nav"></nav>
      <div class="side-foot">
        <button class="side-help" type="button" data-action="tour" data-icon="compass"><span>Get help with navigation</span></button>
        <span class="muted small">🔒 Your files never leave this device.</span>
      </div>
    </aside>
    <main class="scroller" id="scroller">
      <article class="page" id="page" tabindex="-1"></article>
    </main>
  </div>

  <div class="drawer-veil" id="drawer-veil" hidden></div>
  <aside class="drawer" id="drawer" tabindex="-1" role="dialog" aria-modal="false" aria-labelledby="drawer-title" hidden></aside>

  <div class="overlay" id="progress" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="progress-title">
      <div class="spinner" aria-hidden="true"></div>
      <div id="progress-title" class="modal-title">Analyzing your build</div>
      <div class="muted small" id="progress-file"></div>
      <div class="pbar"><div class="pbar-fill" id="progress-bar"></div></div>
      <div class="muted small" id="progress-msg" aria-live="polite"></div>
    </div>
  </div>

  <div class="overlay palette" id="palette" hidden>
    <div class="pal" role="dialog" aria-modal="true" aria-label="Search">
      <input id="palette-input" type="search" placeholder="Search pages, checks, issues and steps…" autocomplete="off">
      <div id="palette-list" class="pal-list"></div>
    </div>
  </div>

  <div class="drag-veil" aria-hidden="true"><div>📦 Drop your APK, AAB, IPA — or a saved .delulu.json report</div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="file" accept=".apk,.aab,.ipa,.json,application/vnd.android.package-archive,application/octet-stream,application/json" hidden>
  <div id="print-root"></div>
  <noscript><p class="noscript">Delulu needs JavaScript to analyze files locally in your browser.</p></noscript>
  <script type="module" src="src/ui/app.js"></script>
</body>
</html>
